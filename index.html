<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Concert+One&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VINGO - Le grand tirage</title>

    <!--
        PLAN DU FICHIER
        1. CSS : couleurs, mise en page, machine, affichage du résultat, grille, responsive
        2. HTML : structure de la page, machine, zone du numéro tiré, grille
        3. JavaScript : création et animation des boules, brassage et retombée
        4. Three.js : création et animation de la manivelle en 3D
        5. JavaScript : construction de la grille, marquage, tirage réel et réinitialisation

        IMPORTANT : cette version est annotée et organisée pour faciliter la lecture.
        Les valeurs, les fonctions et le fonctionnement existant sont conservés.
    -->

    <style>
        /* ============================================================
           1. COULEURS ET VARIABLES GLOBALES
           Les variables ici permettent de réutiliser les couleurs partout.
           ============================================================ */

        :root {
            --cream: #303238;
            --green: #A9C957;
            --blue: #83CDE0;
            --pink: #F47D91;
            --yellow: #F4D65E;
            --orange: #F5A65B;
            --dark: #40372F;
            --light: #d8c499;
        }

        /* ============================================================
           2. BASE DE LA PAGE : réglages communs à tous les éléments
           ============================================================ */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 10px;
            background: var(--cream);
            color: var(--light);
            font-family: 'Concert One', sans-serif;
        }

        /* ============================================================
           3. MISE EN PAGE GÉNÉRALE ET VERSION GRAND ÉCRAN
           ============================================================ */
        header {
            text-align: center;
            margin-bottom: 18px;
        }

        h1 {
            font-family: 'Concert One', sans-serif;
            font-size: 64px;
            margin: 0;
            letter-spacing: 5px;
            color: #d8c499;
        }

        header p {
            font-size: 18px;
            margin-top: 4px;
        }

        .main-container {
            width: 100%;
            max-width: none;
            min-height: calc(100vh - 20px);
            margin: 0;
            display: grid;
            grid-template-columns: minmax(440px, 520px) minmax(0, 1fr);
            grid-template-rows: auto 1fr;
            gap: 14px;
        }

        header {
            grid-column: 1 / -1;
        }

        /* ZONE DE LA MACHINE : panneau gauche avec cage et tirage */
        .machine-area {
            background: #26282d;
            border: 0;
            border-radius: 24px;
            padding: 22px;
            min-height: 560px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 42px;
            color: #d8c499;
        }

        /* EMPLACEMENT DE LA CAGE : taille, halo lumineux et centrage */
        .machine-placeholder {
            position: relative;
            width: 100%;
            flex: 0 0 430px;
            min-height: 430px;
            /* Halo turquoise renforcé derrière la cage */
            background: radial-gradient(ellipse at 50% 50%, rgba(91, 169, 194, 0.28) 0%, rgba(91, 169, 194, 0.12) 48%, transparent 72%);
            border: 0;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Lumière diffuse plus visible, centrée derrière la cage */
        /* HALO TURQUOISE : lumière diffuse derrière la cage */
        .machine-placeholder::before {
            content: "";
            position: absolute;
            width: 430px;
            height: 430px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(65, 190, 225, 0.48) 0%, rgba(65, 190, 225, 0.27) 38%, rgba(65, 190, 225, 0.12) 58%, transparent 75%);
            filter: blur(16px);
            pointer-events: none;
            z-index: 0;
        }

        /* SVG de la cage prototype intégré, sans ancien overlay de manivelle 3D */
        .machine-placeholder svg {
            width: 430px;
            height: 430px;
            flex: none;
            position: relative;
            z-index: 1;
        }

        .machine-placeholder h2,
        .machine-placeholder p {
            display: none;
        }

        /* ZONE DU RÉSULTAT : boule affichée après le tirage */
        .draw-placeholder {
            width: 100%;
            text-align: center;
        }

        .draw-placeholder h2 {
            margin: 0 0 8px;
            font-size: 16px;
            letter-spacing: 2px;
            font-weight: normal;
        }

        /* GRAND AFFICHAGE DU NUMÉRO TIRÉ */
        .number-display {
            width: 301px;
            height: 301px;
            margin: 12px auto 18px;
            background: white;
            border: 24px solid var(--green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            flex-direction: column;
            line-height: 1;
            color: #555;
        }

        /* ANIMATION D'APPARITION DU NUMÉRO */
        #draw-display.reveal-number {
            animation: numberReveal 650ms cubic-bezier(.2, 1.4, .4, 1) both;
        }

        @keyframes numberReveal {
            0% {
                transform: scale(.65) rotate(-12deg);
                opacity: 0;
            }

            65% {
                transform: scale(1.08) rotate(3deg);
                opacity: 1;
            }

            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        /* TYPOGRAPHIE DE LA LETTRE ET DU NUMÉRO */
        .number-letter {
            font-size: 65px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .number-value {
            font-size: 108px;
            font-weight: bold;
        }

        /* BOUTON POUR LANCER UN TIRAGE */
        .draw-button {
            display: block;
            margin: 0 auto;
            padding: 14px 20px;
            border: 0;
            border-radius: 10px;
            background: var(--green);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .draw-button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        /* BOUTON POUR RELANCER UNE PARTIE */
        .restart-button {
            display: block;
            margin: 10px auto 0;
            padding: 10px 16px;
            border: 0;
            border-radius: 8px;
            background: #777b82;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .restart-button:hover {
            background: #666a70;
        }

        /* La partie mobile est animée via son transform SVG, autour de (462,230). */

        /* ============================================================
           4. GRILLE VINGO : apparence des cases et des outils
           ============================================================ */
        .grid-area {
            background: #26282d;
            border: 0;
            border-radius: 24px;
            padding: 22px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: stretch;
        }

        .grid-area h2 {
            text-align: left;
            margin: 0 0 14px;
            color: white;
        }

        .number-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            grid-template-rows: repeat(16, minmax(0, 1fr));
            gap: 5px;
            margin-top: 0;
            flex: 1;
            min-height: 0;
        }

        .grid-cell {
            min-height: 0;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #373a40;
            color: #eee;
            font-family: Arial, sans-serif;
            font-size: 16px;
            border: 2px solid transparent;
            user-select: none;
        }

        .grid-header {
            min-height: 36px;
            font-size: 20px;
            font-weight: bold;
            color: white;
        }

        .grid-header:nth-child(1) {
            background: #39a36b;
        }

        .grid-header:nth-child(2) {
            background: #e6c84f;
            color: #303030;
        }

        .grid-header:nth-child(3) {
            background: #438fc8;
        }

        .grid-header:nth-child(4) {
            background: #9875c2;
        }

        .grid-header:nth-child(5) {
            background: #e88b43;
        }

        .grid-cell.called {
            font-weight: bold;
            color: #202F40;
            border-color: #202F40;
        }

        .grid-cell.called[data-column="V"] {
            background: #39a36b;
        }

        .grid-cell.called[data-column="I"] {
            background: #e6c84f;
        }

        .grid-cell.called[data-column="N"] {
            background: #438fc8;
        }

        .grid-cell.called[data-column="G"] {
            background: #9875c2;
        }

        .grid-cell.called[data-column="O"] {
            background: #e88b43;
        }

        .grid-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
            font-family: Arial, sans-serif;
            color: #b7c1ce;
        }

        .grid-tools button {
            padding: 9px 14px;
            border: 0;
            border-radius: 8px;
            background: #3a3d43;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .grid-tools button:hover {
            background: #4a4d53;
        }

        /* ============================================================
           5. ADAPTATION TABLETTE / PETITS ÉCRANS (900 px)
           ============================================================ */
        @media (max-width: 900px) {
            body {
                padding: 10px;
            }

            .main-container {
                min-height: auto;
                grid-template-columns: 1fr;
            }

            .number-grid {
                flex: none;
                grid-template-rows: repeat(16, auto);
            }

            .machine-area {
                min-height: auto;
            }

            header {
                grid-column: auto;
            }

            .number-display {
                width: 220px;
                height: 220px;
                border-width: 16px;
            }

            .grid-cell {
                min-height: 32px;
                font-size: 16px;
            }
        }

        /* ============================================================
           6. ADAPTATION TÉLÉPHONE (500 px)
           ============================================================ */
        @media (max-width: 500px) {
            .grid-area {
                padding: 12px;
            }

            .number-grid {
                gap: 3px;
            }

            .grid-cell {
                min-height: 29px;
                font-size: 14px;
                border-radius: 5px;
            }

            .grid-header {
                min-height: 38px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- ============================================================
         7. STRUCTURE HTML DE LA PAGE
         ============================================================ -->
    <div class="main-container">

        <!-- EN-TÊTE / TITRE DE L'APPLICATION -->
        <header>
            <h1>VINGO !</h1>
        </header>

        <!-- ============================================================
             8. PANNEAU DE LA MACHINE ET DU TIRAGE
             ============================================================ -->
        <section class="machine-area">
            <!-- Emplacement visuel de la cage SVG et de la manivelle 3D -->
            <div class="machine-placeholder">
                <!-- Cage intégrée depuis le prototype validé : dessin SVG et 20 boules statiques -->
                <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-label="Cage VINGO avec 20 boules">

                    <!--
            --------------------------------------------------
            1. DÉFINITION DE LA ZONE DANS LAQUELLE
               LES BOULES ONT LE DROIT D'APPARAÎTRE
            --------------------------------------------------

            sphereClip définit une forme elliptique.

            Les boules qui dépassent de cette ellipse seront
            masquées : elles restent visuellement à l'intérieur
            de la cage.
            -->

                    <defs>
                        <clipPath id="sphereClip">
                            <ellipse cx="256" cy="235" rx="145" ry="160" />
                        </clipPath>
                    </defs>


                    <!--
            --------------------------------------------------
            2. FOND DE LA CAGE
            --------------------------------------------------

            C'est l'ellipse qui représente le fond de la cage.

            cx = position horizontale du centre
            cy = position verticale du centre
            rx = largeur du rayon
            ry = hauteur du rayon

            fill = couleur de remplissage
            stroke = couleur du contour
            stroke-width = épaisseur du contour
            -->

                    <!-- FOND INTÉRIEUR DE LA CAGE -->
                    <ellipse cx="256" cy="235" rx="145" ry="160" fill="#f9e9cc" />

                    <!--
            --------------------------------------------------
            3. LES BOULES À L'INTÉRIEUR DE LA CAGE
            --------------------------------------------------

            Le groupe <g> permet d'appliquer les mêmes
            paramètres à toutes les boules du groupe.

            clip-path :
            limite l'affichage des boules à la forme de la cage.

            stroke :
            couleur du contour de toutes les boules.

            stroke-width :
            épaisseur du contour de toutes les boules.

            Chaque <circle> représente une boule.

            cx = position horizontale
            cy = position verticale
            r  = rayon, donc taille de la boule
            fill = couleur de la boule

            Pour modifier une boule, il faut donc modifier
            les valeurs de son circle.
            -->

                    <g clip-path="url(#sphereClip)" stroke="#40372f" stroke-width="5.5">

                        <!-- ========================================= -->
                        <!-- BOULES DE LA CAGE : 20 BOULES            -->
                        <!-- ORDRE DE DESSIN : FOND VERS AVANT        -->
                        <!-- ========================================= -->


                        <!-- ========================================= -->
                        <!-- PALIER 4 : HAUT DE LA PILE - ARRIÈRE-PLAN -->
                        <!-- ========================================= -->

                        <!-- Boule violette -->
                        <circle cx="140" cy="275" r="30" fill="#9777B4" />
                        <circle cx="140" cy="275" r="20" fill="#FFFFFF" stroke="#9777B4" stroke-width="2.5" />

                        <!-- Boule verte -->
                        <circle cx="185" cy="280" r="30" fill="#3DA66C" />
                        <circle cx="185" cy="280" r="20" fill="#FFFFFF" stroke="#3DA66C" stroke-width="2.5" />

                        <!-- Boule jaune -->
                        <circle cx="230" cy="270" r="30" fill="#C9AB49" />
                        <circle cx="230" cy="270" r="20" fill="#FFFFFF" stroke="#C9AB49" stroke-width="2.5" />

                        <!-- Boule rose -->
                        <circle cx="275" cy="280" r="30" fill="#E589A8" />
                        <circle cx="275" cy="280" r="20" fill="#FFFFFF" stroke="#E589A8" stroke-width="2.5" />

                        <!-- Boule bleue -->
                        <circle cx="320" cy="270" r="30" fill="#428FCB" />
                        <circle cx="320" cy="270" r="20" fill="#FFFFFF" stroke="#428FCB" stroke-width="2.5" />

                        <!-- Boule orange -->
                        <circle cx="365" cy="280" r="30" fill="#E88A45" />
                        <circle cx="365" cy="280" r="20" fill="#FFFFFF" stroke="#E88A45" stroke-width="2.5" />


                        <!-- ========================================= -->
                        <!-- PALIER 3 : MILIEU DE LA PILE              -->
                        <!-- ========================================= -->

                        <!-- Boule jaune -->
                        <circle cx="150" cy="305" r="30" fill="#C9AB49" />
                        <circle cx="150" cy="305" r="20" fill="#FFFFFF" stroke="#C9AB49" stroke-width="2.5" />

                        <!-- Boule bleue -->
                        <circle cx="200" cy="300" r="30" fill="#428FCB" />
                        <circle cx="200" cy="300" r="20" fill="#FFFFFF" stroke="#428FCB" stroke-width="2.5" />

                        <!-- Boule violette -->
                        <circle cx="250" cy="315" r="30" fill="#9777B4" />
                        <circle cx="250" cy="315" r="20" fill="#FFFFFF" stroke="#9777B4" stroke-width="2.5" />

                        <!-- Boule verte -->
                        <circle cx="300" cy="300" r="30" fill="#3DA66C" />
                        <circle cx="300" cy="300" r="20" fill="#FFFFFF" stroke="#3DA66C" stroke-width="2.5" />

                        <!-- Boule rose -->
                        <circle cx="350" cy="310" r="30" fill="#E589A8" />
                        <circle cx="350" cy="310" r="20" fill="#FFFFFF" stroke="#E589A8" stroke-width="2.5" />


                        <!-- ========================================= -->
                        <!-- PALIER 2 : MILIEU BAS                      -->
                        <!-- ========================================= -->

                        <!-- Boule verte -->
                        <circle cx="170" cy="335" r="30" fill="#3DA66C" />
                        <circle cx="170" cy="335" r="20" fill="#FFFFFF" stroke="#3DA66C" stroke-width="2.5" />

                        <!-- Boule rose -->
                        <circle cx="215" cy="325" r="30" fill="#E589A8" />
                        <circle cx="215" cy="325" r="20" fill="#FFFFFF" stroke="#E589A8" stroke-width="2.5" />

                        <!-- Boule bleue -->
                        <circle cx="260" cy="340" r="30" fill="#428FCB" />
                        <circle cx="260" cy="340" r="20" fill="#FFFFFF" stroke="#428FCB" stroke-width="2.5" />

                        <!-- Boule violette -->
                        <circle cx="310" cy="325" r="30" fill="#9777B4" />
                        <circle cx="310" cy="325" r="20" fill="#FFFFFF" stroke="#9777B4" stroke-width="2.5" />

                        <!-- Boule orange -->
                        <circle cx="355" cy="335" r="30" fill="#E88A45" />
                        <circle cx="355" cy="335" r="20" fill="#FFFFFF" stroke="#E88A45" stroke-width="2.5" />


                        <!-- ========================================= -->
                        <!-- PALIER 1 : FOND DE LA CAGE - PREMIER PLAN -->
                        <!-- ========================================= -->

                        <!-- Boule bleue -->
                        <circle cx="220" cy="360" r="30" fill="#428FCB" />
                        <circle cx="220" cy="360" r="20" fill="#FFFFFF" stroke="#428FCB" stroke-width="2.5" />

                        <!-- Boule verte -->
                        <circle cx="265" cy="355" r="30" fill="#3DA66C" />
                        <circle cx="265" cy="355" r="20" fill="#FFFFFF" stroke="#3DA66C" stroke-width="2.5" />

                        <!-- Boule rose -->
                        <circle cx="305" cy="365" r="30" fill="#E589A8" />
                        <circle cx="305" cy="365" r="20" fill="#FFFFFF" stroke="#E589A8" stroke-width="2.5" />

                        <!-- Boule violette -->
                        <circle cx="345" cy="350" r="30" fill="#9777B4" />
                        <circle cx="345" cy="350" r="20" fill="#FFFFFF" stroke="#9777B4" stroke-width="2.5" />


                    </g>

                    <!-- CONTOUR DE LA CAGE -->
                    <ellipse cx="256" cy="235" rx="145" ry="160" fill="none" stroke="#40372f" stroke-width="10" />

                    <!--
            --------------------------------------------------
            4. BARREAUX HORIZONTAUX DE LA CAGE
            --------------------------------------------------

            Ces lignes sont dessinées avec des courbes.

            fill="none" :
            aucune zone intérieure à remplir.

            stroke :
            couleur des barreaux.

            stroke-width :
            épaisseur des barreaux.

            stroke-linecap="round" :
            extrémités arrondies des traits.

            Les commandes du path :

            M = déplacer le point de départ
            Q = courbe quadratique
                 (un point de contrôle pour créer la courbe)

            Les coordonnées déterminent la position
            et la forme de chaque barreau.
            -->

                    <g fill="none" stroke="#40372f" stroke-width="6" stroke-linecap="round">

                        <!-- BARREAUX VERTICAUX MOBILES -->

                        <path d="M 182 96 Q 137 235 182 374" fill="none" stroke="#40372f" stroke-width="6"
                            stroke-linecap="round" />

                        <path d="M 330 96 Q 375 235 330 374" fill="none" stroke="#40372f" stroke-width="6"
                            stroke-linecap="round" />

                        <path d="M 219 79 Q 189 235 219 390" fill="none" stroke="#40372f" stroke-width="6"
                            stroke-linecap="round" />

                        <path d="M 293 79 Q 323 235 293 390" fill="none" stroke="#40372f" stroke-width="6"
                            stroke-linecap="round" />


                        <!-- BARREAU HORIZONTAL CENTRAL FIXE -->

                        <line x1="114" y1="235" x2="405" y2="235" stroke="#40372f" stroke-width="6"
                            stroke-linecap="round" />


                        <!-- BARREAU VERTICAL CENTRAL FIXE -->

                        <line x1="256" y1="79" x2="256" y2="395" stroke="#40372f" stroke-width="6"
                            stroke-linecap="round" />


                        <!-- BARREAUX HORIZONTAUX MOBILES -->

                        <path d="M 130 153 Q 256 120 383 153" fill="none" stroke="#40372f" stroke-width="6"
                            stroke-linecap="round" />

                        <path d="M 130 317 Q 256 350 383 317" fill="none" stroke="#40372f" stroke-width="6"
                            stroke-linecap="round" />

                    </g>


                    <!--
            --------------------------------------------------
            5. SOCLE DE LA MACHINE
            --------------------------------------------------

            Le socle est dessiné avec un path.

            M = point de départ
            Q = courbe permettant d'arrondir les coins
            L = ligne droite
            Z = fermeture de la forme

            fill = couleur intérieure du socle
            stroke = couleur du contour
            stroke-width = épaisseur du contour
            stroke-linejoin = arrondi des raccords

            Pour modifier sa forme, il faut modifier
            les coordonnées de ce path.
            -->

                    <path
                        d="M94 432 Q82 432 75 443 L58 466 Q53 478 67 478 L445 478 Q459 478 453 466 L436 443 Q429 432 416 432 Z"
                        fill="#8b7d72" stroke="#40372f" stroke-width="7" stroke-linejoin="round" />


                    <!--
            --------------------------------------------------
            6. SUPPORTS DE LA CAGE
            --------------------------------------------------

            Les deux supports sont regroupés dans un <g>.

            Paramètres communs :
            couleur du contour
            épaisseur du contour
            raccords arrondis

            Chaque path dessine un support.

            fill = couleur intérieure des supports.
            -->

                    <g stroke="#40372f" stroke-width="7" stroke-linejoin="round">

                        <!-- Support gauche -->
                        <path d="M87 223 Q87 211 101 211 L113 211 L113 445 L87 445 Z" fill="#8b7d72" />

                        <!--
            --------------------------------------------------
            7. MANIVELLE À DROITE DE LA CAGE
            --------------------------------------------------

            La manivelle est actuellement statique.

            Le groupe <g> contient :
            - le bras de la manivelle
            - la boule/poignée située en haut

            stroke = couleur du contour
            stroke-width = épaisseur du contour
            stroke-linejoin = raccords arrondis
            stroke-linecap = extrémités arrondies

            Le premier path dessine le bras.

            Le cercle dessine la poignée.

            Pour modifier la position :
            les coordonnées du path et du circle
            doivent être ajustées.
            -->



                        <!-- Petite tige fixe : elle reste solidaire du support -->
                        <g id="manivelle-base-fixe" stroke-linejoin="round" stroke-linecap="round">
                            <path d="M414 230 L462 230" fill="none" stroke="#40372f" stroke-width="28" />
                            <path d="M414 230 L462 230" fill="none" stroke="#8b7d72" stroke-width="12" />
                        </g>

                        <!-- Partie mobile : uniquement la longue tige et la poignée -->
                        <g id="manivelle-animée" stroke-linejoin="round" stroke-linecap="round">
                            <path id="manivelle-tige-contour" d="M462 230 L462 132" fill="none" stroke="#40372f"
                                stroke-width="28" />
                            <path id="manivelle-tige-interieur" d="M462 230 L462 132" fill="none" stroke="#8b7d72"
                                stroke-width="12" />
                            <circle id="manivelle-poignee" cx="462" cy="105" r="29" fill="#40372f" stroke="#40372f"
                                stroke-width="7" />
                        </g>

                        <!-- Support droit -->
                        <path d="M399 211 L411 211 Q425 211 425 223 L425 445 L399 445 Z" fill="#8b7d72" />

                    </g>




                </svg>

                <h2>Notre machine</h2>
                <p>La cage arrive bientôt 🎱</p>
            </div>

            <!-- AFFICHAGE DU RÉSULTAT DU TIRAGE ET BOUTON -->
            <div class="draw-placeholder">
                <h2>Numéro tiré</h2>
                <div class="number-display" id="draw-display" aria-live="polite">
                    <span class="number-letter" id="draw-letter">?</span>
                    <span class="number-value" id="draw-number">?</span>
                </div>
                <p id="draw-status">En attente du tirage...</p>
                <button id="draw-number-button" class="draw-button" type="button">TIRER UN NUMÉRO</button>
                <button id="grid-reset" class="restart-button" type="button">RELANCER UNE PARTIE</button>
            </div>
        </section>

        <!-- ============================================================
             9. PANNEAU DE LA GRILLE ET COMMANDES DE GRILLE
             ============================================================ -->
        <section class="grid-area">
            <h2>Grille des numéros</h2>
            <div id="number-grid" class="number-grid" aria-label="Grille VINGO des numéros de 1 à 75"></div>
            <div class="grid-tools">
                <span id="grid-counter">0 / 75 numéros cochés</span>
            </div>
        </section>

    </div>
    <script>
        // ============================================================
        // ANIMATION DES BOULES : BRASSAGE + RETOMBÉE (MOUVEMENT SIMPLE)
        // Reprise du système de mouvement de la version fonctionnelle.
        // La manivelle, la grille et le tirage restent inchangés.
        // ============================================================
        (function () {
            const svg = document.querySelector('.machine-placeholder svg');
            const ballGroup = svg.querySelector('g[clip-path="url(#sphereClip)"]');
            const circles = Array.from(ballGroup.querySelectorAll('circle'));
            const balls = [];

            // Chaque boule est composée d'un cercle extérieur et d'un cercle intérieur.
            for (let i = 0; i < circles.length; i += 2) {
                const outer = circles[i];
                const inner = circles[i + 1];
                const startX = Number(outer.getAttribute('cx'));
                const startY = Number(outer.getAttribute('cy'));
                balls.push({
                    outer, inner,
                    startX, startY,
                    x: 0, y: 0,
                    speedX: (Math.random() - 0.5) * 3,
                    speedY: (Math.random() - 0.5) * 6,
                    offsetX: Number(inner.getAttribute('cx')) - startX,
                    offsetY: Number(inner.getAttribute('cy')) - startY
                });
            }

            // Limites du brassage, adaptées à la taille de cette cage SVG.
            const minX = -30, maxX = 30;
            const minY = -200, maxY = 5;
            const centerX = 256, centerY = 235;
            const radiusX = 145 - 4 - 30;
            const radiusY = 160 - 4 - 30;

            function drawBall(b) {
                b.outer.setAttribute('cx', b.startX + b.x);
                b.outer.setAttribute('cy', b.startY + b.y);
                b.inner.setAttribute('cx', b.startX + b.x + b.offsetX);
                b.inner.setAttribute('cy', b.startY + b.y + b.offsetY);
            }

            // Position de repos : retour aux positions initiales définies dans le SVG.
            window.remettreBoulesAuRepos = function () {
                balls.forEach(b => {
                    b.x = 0;
                    b.y = 0;
                    b.speedX = 0;
                    b.speedY = 0;
                    drawBall(b);
                });
            };
        window.remettreBoulesAuRepos();

        window.boulesEnMouvement = false;
        window.chuteBoules = false;
        window.chuteStartTime = 0;
        window.chuteDuration = 0;
        window.chutePositionsInitiales = [];
        window.numeroDejaRevelePendantChute = false;

        let animationFrame = 0;

        function animateBalls() {
            if (window.boulesEnMouvement) {
                balls.forEach(b => {
                    b.x += b.speedX;
                    b.y += b.speedY;
                    b.speedY += 0.01;

                    if (b.x < minX || b.x > maxX) b.speedX *= -1;

                    const absoluteX = b.startX + b.x;
                    const dx = absoluteX - centerX;
                    const floorAbsolute = centerY + radiusY * Math.sqrt(
                        Math.max(0, 1 - (dx * dx) / (radiusX * radiusX))
                    );
                    const floorRelative = floorAbsolute - b.startY;

                    if (b.y > floorRelative) {
                        b.y = floorRelative;
                        b.speedY *= -0.5;
                    }
                    if (b.y < minY) {
                        b.y = minY;
                        b.speedY *= -0.5;
                    }
                    drawBall(b);
                });
            } else if (window.chuteBoules) {
                // Retour synchronisé : toutes les boules rejoignent leur position
                // SVG initiale sur la durée prévue, avec une fin douce.
                const elapsed = performance.now() - window.chuteStartTime;
                const progress = Math.min(1, elapsed / window.chuteDuration);
                // Ease-out : le mouvement est régulier puis ralentit légèrement à l'arrivée.
                const eased = 1 - Math.pow(1 - progress, 3);
                balls.forEach((b, index) => {
                    const start = window.chutePositionsInitiales[index];
                    b.x = start.x * (1 - eased);
                    b.y = start.y * (1 - eased);
                    if (progress >= 1) {
                        b.x = 0;
                        b.y = 0;
                        b.speedX = 0;
                        b.speedY = 0;
                    }
                    drawBall(b);
                });

                if (progress >= 1) {
                    window.chuteBoules = false;
                    window.remettreBoulesAuRepos();
                    const bouton = document.getElementById('draw-number-button');
                    if (bouton && !window.tousLesNumerosVingoTires) bouton.disabled = false;
                }
            }
            if (window.boulesEnMouvement || window.chuteBoules) {
                animationFrame = requestAnimationFrame(animateBalls);
            }
        }

        window.vingoStartMixing = function () {
            window.boulesEnMouvement = true;
            window.chuteBoules = false;
            window.numeroDejaRevelePendantChute = false;
            balls.forEach(b => {
                b.speedX = (Math.random() - 0.5) * 3;
                b.speedY = (Math.random() - 0.5) * 6;
            });
            cancelAnimationFrame(animationFrame);
            animationFrame = requestAnimationFrame(animateBalls);
        };

        window.vingoStopMixingAndSettle = function (cycleStartTime, totalDuration = 4000) {
            window.boulesEnMouvement = false;
            window.chuteBoules = true;
            // Le cycle total, manivelle comprise, est fixé à 4 secondes.
            // La retombée occupe le temps restant après le mouvement de manivelle.
            const elapsedBeforeFall = performance.now() - cycleStartTime;
            window.chuteStartTime = performance.now();
            window.chuteDuration = Math.max(1, totalDuration - elapsedBeforeFall);
            window.chutePositionsInitiales = balls.map(b => ({ x: b.x, y: b.y }));
            window.numeroDejaRevelePendantChute = false;
            animationFrame = requestAnimationFrame(animateBalls);
            return new Promise(resolve => {
                const check = () => {
                    if (!window.chuteBoules) resolve();
                    else setTimeout(check, 20);
                };
                check();
            });
        };

        // Réinitialise l'animation de la cage et replace les boules.
        window.vingoResetMachine = function () {
            cancelAnimationFrame(animationFrame);
            window.boulesEnMouvement = false;
            window.chuteBoules = false;
            window.chuteStartTime = 0;
            window.numeroDejaRevelePendantChute = false;
            window.remettreBoulesAuRepos();
            animationFrame = 0;
        };
}) ();
    </script>


    <script>
        // ============================================================
        // 12. GRILLE VINGO : CONSTRUCTION, MARQUAGE ET TIRAGE AUTOMATIQUE
        // ============================================================
        // Ce bloc est isolé dans une fonction auto-exécutée pour garder
        // ses variables locales et éviter de polluer l'espace global.
        (function () {
            const grid = document.getElementById('number-grid');
            const counter = document.getElementById('grid-counter');
            const resetButton = document.getElementById('grid-reset');
            const letters = ['V', 'I', 'N', 'G', 'O'];
            const markedNumbers = new Set();

            // ------------------------------------------------------------
            // 12.1 CRÉATION DES EN-TÊTES V, I, N, G, O
            // ------------------------------------------------------------
            letters.forEach(letter => {
                const header = document.createElement('div');
                header.className = 'grid-cell grid-header';
                header.textContent = letter;
                grid.appendChild(header);
            });

            // ------------------------------------------------------------
            // 12.2 CRÉATION DES 75 CASES DE LA GRILLE
            // 15 lignes : chaque colonne contient sa plage de 15 numéros.
            for (let row = 0; row < 15; row++) {
                letters.forEach((letter, column) => {
                    const number = column * 15 + row + 1;
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.textContent = number;
                    cell.dataset.number = number;
                    cell.dataset.column = letter;
                    cell.title = 'Numéro marqué automatiquement lors du tirage';
                    grid.appendChild(cell);
                });
            }

            // 12.3 MISE À JOUR DU COMPTEUR DE CASES COCHÉES
            function updateCounter() {
                counter.textContent = markedNumbers.size + ' / 75 numéros tirés';
            }

            // ------------------------------------------------------------
            // 12.4 MARQUAGE AUTOMATIQUE D'UN NUMÉRO DANS LA GRILLE
            // Fonction utilisée par le tirage automatique.
            window.marquerNumeroVingo = function (number) {
                const cell = grid.querySelector('[data-number="' + number + '"]');
                if (!cell || markedNumbers.has(number)) return;
                markedNumbers.add(number);
                cell.classList.add('called');
                cell.setAttribute('aria-pressed', 'true');
                updateCounter();
            };

            // ------------------------------------------------------------
            // 12.5 LOGIQUE DU TIRAGE : NUMÉRO UNIQUE, LETTRE, COULEUR ET AFFICHAGE
            // ------------------------------------------------------------
            // Les numéros déjà tirés sont stockés dans drawnNumbers pour éviter
            // qu'un même numéro sorte deux fois.
            const drawButton = document.getElementById('draw-number-button');
            const drawLetter = document.getElementById('draw-letter');
            const drawNumber = document.getElementById('draw-number');
            const drawStatus = document.getElementById('draw-status');
            const drawnNumbers = new Set();
            const letterByNumber = number => ['V', 'I', 'N', 'G', 'O'][Math.floor((number - 1) / 15)];

            // Fonction appelée à la fin de la retombée (ou par sécurité si elle est courte).
            // Elle choisit un numéro parmi ceux qui n'ont pas encore été tirés.
            window.tousLesNumerosVingoTires = false;
            window.tirerNumeroVingo = function () {
                const available = [];
                for (let n = 1; n <= 75; n++) {
                    if (!drawnNumbers.has(n)) available.push(n);
                }
                if (available.length === 0) {
                    drawStatus.textContent = 'Tous les 75 numéros ont été tirés !';
                    drawButton.disabled = true;
                    window.tousLesNumerosVingoTires = true;
                    return;
                }
                const number = available[Math.floor(Math.random() * available.length)];
                const letter = letterByNumber(number);
                drawnNumbers.add(number);
                drawLetter.textContent = letter;
                drawNumber.textContent = number;

                // Couleur du grand affichage identique à celle de la colonne dans la grille
                const colorsByLetter = {
                    V: '#39a36b',
                    I: '#e6c84f',
                    N: '#438fc8',
                    G: '#9875c2',
                    O: '#e88b43'
                };
                const drawDisplay = document.getElementById('draw-display');
                drawLetter.style.color = colorsByLetter[letter];
                drawNumber.style.color = colorsByLetter[letter];
                drawDisplay.style.borderColor = colorsByLetter[letter];

                drawStatus.textContent = 'Tirage ' + drawnNumbers.size + ' / 75';
                drawDisplay.classList.remove('reveal-number');
                void drawDisplay.offsetWidth; // relance l'animation pour chaque tirage
                drawDisplay.classList.add('reveal-number');
                window.marquerNumeroVingo(number);
                if (drawnNumbers.size === 75) {
                    drawButton.disabled = true;
                    window.tousLesNumerosVingoTires = true;
                    drawStatus.textContent = 'Tous les 75 numéros ont été tirés !';
                }
            };

            // ------------------------------------------------------------
            // 12.6 ACTION DU BOUTON PRINCIPAL : BRASSAGE DE LA CAGE
            // La manivelle descend jusqu'à la position basse, puis remonte en position haute avant le tirage.
            const crankRodOutline = document.getElementById('manivelle-tige-contour');
            const crankRodInner = document.getElementById('manivelle-tige-interieur');
            const crankHandle = document.getElementById('manivelle-poignee');
            const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

            // Déplacement sans rotation : le point d'attache reste fixe, tandis que
            // l'extrémité de la longue tige et la poignée descendent puis remontent.
            function animateCrank(fromY, toY, fromHandleY, toHandleY, duration = 520) {
                return new Promise(resolve => {
                    const start = performance.now();
                    function frame(now) {
                        const progress = Math.min((now - start) / duration, 1);
                        // Courbe douce, sans effet de rotation ni rebond.
                        const eased = progress < 0.5
                            ? 2 * progress * progress
                            : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                        const rodY = fromY + (toY - fromY) * eased;
                        const handleY = fromHandleY + (toHandleY - fromHandleY) * eased;
                        const path = `M462 230 L462 ${rodY.toFixed(2)}`;
                        crankRodOutline.setAttribute('d', path);
                        crankRodInner.setAttribute('d', path);
                        crankHandle.setAttribute('cy', handleY.toFixed(2));
                        if (progress < 1) requestAnimationFrame(frame);
                        else resolve();
                    }
                    requestAnimationFrame(frame);
                });
            }

            drawButton.addEventListener('click', async () => {
                if (drawButton.disabled) return;
                drawButton.disabled = true;
                drawStatus.textContent = 'Brassage des boules…';

                // Le cycle complet, depuis l'action sur la manivelle jusqu'à
                // la dernière boule replacée, doit durer 4 secondes.
                const cycleStartTime = performance.now();
                window.vingoStartMixing();
                await animateCrank(132, 355, 105, 382);
                await animateCrank(355, 132, 382, 105);

                // La manivelle est revenue : plus d'impulsion, les boules terminent
                // leur chute et se stabilisent avant le tirage.
                // La retombée continue jusqu'à 4 secondes au total.
                // Le numéro, lui, est révélé exactement 2 secondes après le clic.
                const settlePromise = window.vingoStopMixingAndSettle(cycleStartTime, 4000);
                await wait(Math.max(0, 2000 - (performance.now() - cycleStartTime)));
                window.tirerNumeroVingo();

                // On attend ensuite la fin de l'animation complète (4 secondes)
                // avant de permettre le prochain tirage.
                await settlePromise;
                if (!window.tousLesNumerosVingoTires) drawButton.disabled = false;
            });

            // ------------------------------------------------------------
            // 12.7 RÉINITIALISATION : grille, tirages, affichage et bouton
            // ------------------------------------------------------------
            resetButton.addEventListener('click', () => {
                markedNumbers.clear();
                drawnNumbers.clear();
                drawLetter.textContent = '?';
                drawNumber.textContent = '?';
                drawLetter.style.color = '#555';
                drawNumber.style.color = '#555';
                document.getElementById('draw-display').style.borderColor = 'var(--green)';
                drawStatus.textContent = 'En attente du tirage...';
                drawButton.disabled = false;
                window.tousLesNumerosVingoTires = false;
                if (typeof window.vingoResetMachine === 'function') window.vingoResetMachine();
                const rodStartPath = 'M462 230 L462 132';
                crankRodOutline.setAttribute('d', rodStartPath);
                crankRodInner.setAttribute('d', rodStartPath);
                crankHandle.setAttribute('cy', '105');
                grid.querySelectorAll('.grid-cell[data-number]').forEach(cell => {
                    cell.classList.remove('called');
                    cell.setAttribute('aria-pressed', 'false');
                });
                updateCounter();
            });
        })();
    </script>
